<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071018"><title>Guiada · Operação MEGARIO</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#eef5f8;font-family:Arial,system-ui,sans-serif}.wrap{max-width:780px;margin:auto;padding:18px}.head{position:sticky;top:0;z-index:5;background:rgba(7,16,24,.92);backdrop-filter:blur(12px);padding:16px 0 12px}.ey{font-size:11px;letter-spacing:.15em;color:#8da0ad;font-weight:700}.title{font-size:25px;font-weight:800;margin:5px 0}.meta{font-size:12px;color:#8da0ad}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0}.tabs button{border:1px solid #29404d;background:#0e1b24;color:#b9c8d0;border-radius:999px;padding:9px 13px;font-weight:700;white-space:nowrap}.tabs button.on{background:#42c7ff;color:#04121b;border-color:#42c7ff}.card{background:#0d1821;border:1px solid #1e303b;border-radius:18px;margin:12px 0;overflow:hidden}.rtitle{padding:14px 16px;font-weight:800;font-size:17px;background:#102331}.carrier{margin:12px;border-radius:13px;overflow:hidden;border:1px solid #20323d}.ch{padding:10px 12px;font-weight:800}.route{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;border-top:1px solid #20323d;background:#0b151d}.rn{font-size:17px;font-weight:800}.vaga{background:#0a5795;padding:6px 10px;border-radius:8px;font-weight:800;align-self:start}.sacas{grid-column:1/-1;background:#071018;border-radius:10px;padding:9px 10px;color:#ffbd58;font-size:13px}.sacas b{color:#fff}.empty,.err{padding:30px;text-align:center;color:#93a5b0}.updated{display:inline-block;margin-top:5px;color:#5ee6b0;font-size:12px}.dot{display:inline-block;width:7px;height:7px;background:#5ee6b0;border-radius:50%;box-shadow:0 0 10px #5ee6b0;margin-right:5px}</style></head><body><div class="wrap"><div class="head"><div class="ey">CONSULTA · SOMENTE GUIADAS</div><div class="title">Guiadas · Operação MEGARIO</div><div id="meta" class="meta">Carregando...</div><div id="tabs" class="tabs"></div></div><main id="app"><div class="empty">Buscando a Guiada atual...</div></main></div>
<script>
/* Preencha estes dois valores uma vez antes de publicar este arquivo. */
const SUPABASE_URL="https://facxgnlcwvextltxpbqn.supabase.co";
const SUPABASE_KEY="sb_publishable_ca35t-HrAIN5fpJk45P8FQ_10xWlHIV";
const qs=new URLSearchParams(location.search),slug=qs.get('g')||'megario';let DATA=null,sel=0;
const COLORS={AL:['#111','#fff'],EC:['#f6e2c0','#111'],MS:['#8a8a8a','#fff'],HW:['#16357a','#fff'],ME:['#f4c7ad','#111'],PL:['#7b5ea7','#fff'],OT:['#ffef2e','#111'],PC:['#fff','#111'],KG:['#f39200','#111'],DL:['#4f7a2e','#fff'],CM:['#22e024','#111'],DC:['#22e6ea','#111'],PY:['#b8860b','#fff']};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){if(!DATA)return;document.getElementById('meta').innerHTML=`Ciclo <b>${esc(DATA.ciclo)}</b> · Layout ${esc(DATA.layout)}<br><span class="updated"><span class="dot"></span>Atualizado ${new Date(DATA.updated_at).toLocaleString('pt-BR')}</span>`;const ruas=DATA.ruas||[];document.getElementById('tabs').innerHTML=`<button class="${sel===0?'on':''}" onclick="sel=0;render()">Todas</button>`+ruas.filter(r=>r.n).map(r=>`<button class="${sel===r.n?'on':''}" onclick="sel=${r.n};render()">Rua ${r.n}</button>`).join('');const show=sel?ruas.filter(r=>r.n===sel):ruas;document.getElementById('app').innerHTML=show.map(r=>`<section class="card"><div class="rtitle">GUIADA · ${esc(r.title)}</div>${(r.carriers||[]).map(c=>{const col=COLORS[c.k]||['#344','#fff'];return `<div class="carrier"><div class="ch" style="background:${col[0]};color:${col[1]}">${esc(c.k)} · ${esc(c.name)}</div>${(c.routes||[]).map(x=>`<div class="route"><div><div class="rn">${esc(x.rota)}</div></div><div class="vaga">Vaga ${esc(x.vaga||'—')}</div>${x.sacas&&x.sacas.length?`<div class="sacas"><b>${x.sacas.length} ${x.sacas.length===1?'saca':'sacas'}</b> · Nº ${x.sacas.map(esc).join(', ')}</div>`:''}</div>`).join('')}</div>`}).join('')}</section>`).join('')||'<div class="empty">Nenhuma Guiada publicada.</div>'}
async function load(){if(!SUPABASE_URL.startsWith('http')||SUPABASE_KEY.startsWith('COLE_')){document.getElementById('app').innerHTML='<div class="err">A página ainda precisa receber a URL e a chave pública do Supabase antes de ser publicada.</div>';return}try{const r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/svc_guiadas?slug=eq.'+encodeURIComponent(slug)+'&select=data,updated_at&limit=1',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});if(!r.ok)throw 0;const j=await r.json();DATA=j[0]?.data||null;if(DATA)render();else document.getElementById('app').innerHTML='<div class="empty">Ainda não existe Guiada publicada para este link.</div>'}catch(e){document.getElementById('app').innerHTML='<div class="err">Não consegui carregar a Guiada agora.</div>'}}
load();setInterval(load,15000);
</script></body></html>
